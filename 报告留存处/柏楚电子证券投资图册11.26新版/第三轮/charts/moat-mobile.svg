<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1758" role="img" aria-labelledby="title desc"><title id="title">工艺适配怎样变成订单、利润和现金</title><desc id="desc">虚线：待项目验证的机制；实线：披露的计量联系；点线：集团历史结果。；2024→2025：主营毛利+3.05亿；CFO+1.52亿；简化现金余量+2.30亿。；案例不能单独归属集团利润。FCFF另从核心NOPAT、折旧、经营资本和资本开支推导。</desc><rect width="280" height="1758" rx="25" fill="#f0f8f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#377d69" stroke-width="1.4"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#203f37"><text x="20" y="35" font-size="24" font-weight="700">工艺适配怎样变成</text><text x="20" y="66" font-size="24" font-weight="700">订单、利润和现金</text><rect x="20" y="125" width="240" height="180" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="35" y="155" font-size="18" font-weight="700">能力积累 → 加工价值</text><text x="35" y="185" font-size="18">控制、传感、工艺库、接</text><text x="35" y="210" font-size="18">口复用</text><text x="35" y="245" font-size="18">验证工时、合格率、节拍</text><text x="35" y="270" font-size="18">、停机</text><path d="M 140.0 311 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="20" y="353" width="240" height="180" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="35" y="383" font-size="18" font-weight="700">客户选择 → 订单</text><text x="35" y="413" font-size="18">比较可交付效果、扣返价</text><text x="35" y="438" font-size="18">与责任</text><text x="35" y="473" font-size="18">宏石会重选；嘉泰含升级</text><text x="35" y="498" font-size="18">和返利</text><path d="M 140.0 539 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="20" y="581" width="240" height="180" rx="19" fill="#eae3f3" stroke="#c4dcd1"/><text x="35" y="611" font-size="18" font-weight="700">收入 → 毛利</text><text x="35" y="641" font-size="18">控制留单、实际配套、规</text><text x="35" y="666" font-size="18">格组合</text><text x="35" y="701" font-size="18">履约量×净价−增量产品</text><text x="35" y="726" font-size="18">成本</text><path d="M 140.0 767 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="809" width="240" height="180" rx="19" fill="#f5ead9" stroke="#c4dcd1"/><text x="35" y="839" font-size="18" font-weight="700">毛利 → 经营利润</text><text x="35" y="869" font-size="18">承担研发、销售、质保和</text><text x="35" y="894" font-size="18">售后</text><text x="35" y="929" font-size="18">已进成本的支出不重复扣</text><text x="35" y="954" font-size="18">减</text><path d="M 140.0 995 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="1037" width="240" height="180" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="35" y="1067" font-size="18" font-weight="700">利润 → 经营现金</text><text x="35" y="1097" font-size="18">备货与发货占用存货、应</text><text x="35" y="1122" font-size="18">收、票据</text><text x="35" y="1157" font-size="18">到账−采购、人员、税费</text><text x="35" y="1182" font-size="18">等付现</text><path d="M 140.0 1223 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="1265" width="240" height="180" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="35" y="1295" font-size="18" font-weight="700">现金 → 再投入余量</text><text x="35" y="1325" font-size="18">CFO−购建付现＝简化现</text><text x="35" y="1350" font-size="18">金余量</text><text x="35" y="1385" font-size="18">回款需继续支持研发、服</text><text x="35" y="1410" font-size="18">务和维护</text><text x="20" y="1498" font-size="16" fill="#4d675f">虚线：待项目验证的机制；实线</text><text x="20" y="1522" font-size="16" fill="#4d675f">：披露的计量联系；点线：集团</text><text x="20" y="1546" font-size="16" fill="#4d675f">历史结果。</text><text x="20" y="1570" font-size="16" fill="#4d675f">2024→2025：主营毛利</text><text x="20" y="1594" font-size="16" fill="#4d675f">+3.05亿；CFO+1.5</text><text x="20" y="1618" font-size="16" fill="#4d675f">2亿；简化现金余量+2.30</text><text x="20" y="1642" font-size="16" fill="#4d675f">亿。</text><text x="20" y="1666" font-size="16" fill="#4d675f">案例不能单独归属集团利润。F</text><text x="20" y="1690" font-size="16" fill="#4d675f">CFF另从核心NOPAT、折</text><text x="20" y="1714" font-size="16" fill="#4d675f">旧、经营资本和资本开支推导。</text><rect x="12" y="1475" width="256" height="269" rx="12" fill="none" stroke="#699a87" stroke-dasharray="2 5" stroke-width="1.6"/></g></svg>