<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1206" role="img" aria-labelledby="title desc"><title id="title">从一张板材图到合格工件</title><desc id="desc">标准软件简单安装；整机配置、试切、培训与维护分项承担。；来源：2025年报p5–6、14、18、161–162。工艺结果还受材料、光源和机械条件影响。</desc><rect width="280" height="1206" rx="25" fill="#f0f8f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#377d69" stroke-width="1.4"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#203f37"><text x="20" y="35" font-size="24" font-weight="700">从一张板材图到合格工</text><text x="20" y="66" font-size="24" font-weight="700">件</text><rect x="20" y="125" width="240" height="180" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="35" y="155" font-size="18" font-weight="700">图纸与排样</text><text x="35" y="185" font-size="18">CAD读图、编辑几何</text><text x="35" y="245" font-size="18">套料安排板面和材料使用</text><path d="M 140.0 311 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="353" width="240" height="180" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="35" y="383" font-size="18" font-weight="700">刀路与工艺</text><text x="35" y="413" font-size="18">CAM安排穿孔、共边、顺</text><text x="35" y="438" font-size="18">序</text><text x="35" y="473" font-size="18">管材还需处理焊缝与偏差</text><path d="M 140.0 539 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="581" width="240" height="180" rx="19" fill="#eae3f3" stroke="#c4dcd1"/><text x="35" y="611" font-size="18" font-weight="700">轨迹与速度</text><text x="35" y="641" font-size="18">NC协调机床与驱动运动</text><text x="35" y="701" font-size="18">激光器供光、切割头聚焦</text><path d="M 140.0 767 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="809" width="240" height="180" rx="19" fill="#f5ead9" stroke="#c4dcd1"/><text x="35" y="839" font-size="18" font-weight="700">反馈与工件</text><text x="35" y="869" font-size="18">电容等传感反馈调节间距</text><text x="35" y="929" font-size="18">尺寸、边缘和节拍由整机</text><text x="35" y="954" font-size="18">验证</text><text x="20" y="1042" font-size="16" fill="#4d675f">标准软件简单安装；整机配置、</text><text x="20" y="1066" font-size="16" fill="#4d675f">试切、培训与维护分项承担。</text><text x="20" y="1090" font-size="16" fill="#4d675f">来源：2025年报p5–6、</text><text x="20" y="1114" font-size="16" fill="#4d675f">14、18、161–162。</text><text x="20" y="1138" font-size="16" fill="#4d675f">工艺结果还受材料、光源和机械</text><text x="20" y="1162" font-size="16" fill="#4d675f">条件影响。</text></g></svg>