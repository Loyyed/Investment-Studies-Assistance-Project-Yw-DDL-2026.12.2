<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 481" role="img" aria-labelledby="title desc"><title id="title">采购、交付、收入与到账的时点</title><desc id="desc">直销说明柏楚的合同关系，OEM与终端直购收入未完整拆分。；来源：2025年报p14、28、119、161–162、213。箭头表示业务联系，不预设统一账期。</desc><rect width="1240" height="481" rx="25" fill="#f0f8f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#377d69" stroke-width="1.4"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#203f37"><text x="20" y="35" font-size="30" font-weight="700">采购、交付、收入与到账的时点</text><rect x="20.0" y="125" width="277.5" height="185" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="35.0" y="155" font-size="18" font-weight="700">下单：合同买方</text><text x="35.0" y="185" font-size="20">整机厂采购控制、软件和硬</text><text x="35.0" y="210" font-size="20">件</text><text x="35.0" y="245" font-size="20">加工厂用整机交付工件</text><path d="M 302.5 217.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="327.5" y="125" width="277.5" height="185" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="342.5" y="155" font-size="18" font-weight="700">安装和验收：分合同层</text><text x="342.5" y="185" font-size="20">柏楚供货、组测与现场支持</text><text x="342.5" y="245" font-size="20">整机厂配置试切；责任查合</text><text x="342.5" y="270" font-size="20">同</text><path d="M 610.0 217.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="635.0" y="125" width="277.5" height="185" rx="19" fill="#eae3f3" stroke="#c4dcd1"/><text x="650.0" y="155" font-size="18" font-weight="700">确认收入：按履约</text><text x="650.0" y="185" font-size="20">标准品签收并达到合同标准</text><text x="650.0" y="245" font-size="20">其他软件交付；有效期软件</text><text x="650.0" y="270" font-size="20">激活</text><path d="M 917.5 217.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="942.5" y="125" width="277.5" height="185" rx="19" fill="#f5ead9" stroke="#c4dcd1"/><text x="957.5" y="155" font-size="18" font-weight="700">到账：按结算回款</text><text x="957.5" y="185" font-size="20">年度折扣预估冲收入、实结</text><text x="957.5" y="210" font-size="20">调整</text><text x="957.5" y="245" font-size="20">货款到账独立；售后和质保</text><text x="957.5" y="270" font-size="20">查条款</text><text x="20" y="385" font-size="18" fill="#4d675f">直销说明柏楚的合同关系，OEM与终端直购收入未完整拆分。</text><text x="20" y="409" font-size="18" fill="#4d675f">来源：2025年报p14、28、119、161–162、213。箭头表示业务联系，不预设统一账期。</text></g></svg>