<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1254" role="img" aria-labelledby="title desc"><title id="title">简化现金余量增加来自哪里</title><desc id="desc">原值：2024年报p116–117、2025年报p130，集团合并人民币元；公式差0.00元。；2025应收与存货仍占用资金；购建下降含单年节奏。维护与扩张投入未拆分，本图不等于FCFF。</desc><rect width="280" height="1254" rx="25" fill="#f0f8f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#377d69" stroke-width="1.4"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#203f37"><text x="20" y="35" font-size="24" font-weight="700">简化现金余量增加来自</text><text x="20" y="66" font-size="24" font-weight="700">哪里</text><rect x="20" y="125" width="240" height="180" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="35" y="155" font-size="18" font-weight="700">2024 简化现金余量</text><text x="35" y="185" font-size="18">CFO 9.5244</text><text x="35" y="228" font-size="18">−购建 1.1322</text><text x="35" y="271" font-size="18">＝8.3923 亿元</text><path d="M 140.0 311 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="353" width="240" height="180" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="35" y="383" font-size="18" font-weight="700">经营现金流增加</text><text x="35" y="413" font-size="18">11.0432 − 9.5244</text><text x="35" y="473" font-size="18">贡献 +1.5188 亿元</text><path d="M 140.0 539 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="581" width="240" height="180" rx="19" fill="#eae3f3" stroke="#c4dcd1"/><text x="35" y="611" font-size="18" font-weight="700">购建付现减少</text><text x="35" y="641" font-size="18">1.1322 − 0.3520</text><text x="35" y="701" font-size="18">贡献 +0.7801 亿元</text><path d="M 140.0 767 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="809" width="240" height="180" rx="19" fill="#f5ead9" stroke="#c4dcd1"/><text x="35" y="839" font-size="18" font-weight="700">2025 简化现金余量</tex