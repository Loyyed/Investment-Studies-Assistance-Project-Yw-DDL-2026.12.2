<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 764" role="img" aria-labelledby="title desc"><title id="title">工艺适配怎样变成订单、利润和现金</title><desc id="desc">虚线：待项目验证的机制；实线：披露的计量联系；点线：集团历史结果。；2024→2025：主营毛利+3.05亿；CFO+1.52亿；简化现金余量+2.30亿。；案例不能单独归属集团利润。FCFF另从核心NOPAT、折旧、经营资本和资本开支推导。</desc><rect width="1240" height="764" rx="25" fill="#f0f8f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#377d69" stroke-width="1.4"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#203f37"><text x="20" y="35" font-size="30" font-weight="700">工艺适配怎样变成订单、利润和现金</text><rect x="20.0" y="125" width="380.0" height="185" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="35.0" y="155" font-size="18" font-weight="700">能力积累 → 加工价值</text><text x="35.0" y="185" font-size="20">控制、传感、工艺库、接口复用</text><text x="35.0" y="245" font-size="20">验证工时、合格率、节拍、停机</text><path d="M 405.0 217.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="430.0" y="125" width="380.0" height="185" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="445.0" y="155" font-size="18" font-weight="700">客户选择 → 订单</text><text x="445.0" y="185" font-size="20">比较可交付效果、扣返价与责任</text><text x="445.0" y="245" font-size="20">宏石会重选；嘉泰含升级和返利</text><path d="M 815.0 217.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="840.0" y="125" width="380.0" height="185" rx="19" fill="#eae3f3" stroke="#c4dcd1"/><text x="855.0" y="155" font-size="18" font-weight="700">收入 → 毛利</text><text x="855.0" y="185" font-size="20">控制留单、实际配套、规格组合</text><text x="855.0" y="245" font-size="20">履约量×净价−增量产品成本</text><path d="M 1030.0 315 v 24 H 210.0 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20.0" y="380" width="380.0" height="185" rx="19" fill="#f5ead9" stroke="#c4dcd1"/><text x="35.0" y="410" font-size="18" font-weight="700">毛利 → 经营利润</text><text x="35.0" y="440" font-size="20">承担研发、销售、质保和售后</text><text x="35.0" y="500" font-size="20">已进成本的支出不重复扣减</text><path d="M 405.0 472.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430.0" y="380" width="380.0" height="185" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="445.0" y="410" font-size="18" font-weight="700">利润 → 经营现金</text><text x="445.0" y="440" font-size="20">备货与发货占用存货、应收、票据</text><text x="445.0" y="500" font-size="20">到账−采购、人员、税费等付现</text><path d="M 815.0 472.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840.0" y="380" width="380.0" height="185" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="855.0" y="410" font-size="18" font-weight="700">现金 → 再投入余量</text><text x="855.0" y="440" font-size="20">CFO−购建付现＝简化现金余量</text><text x="855.0" y="500" font-size="20">回款需继续支持研发、服务和维护</text><text x="20" y="640" font-size="18" fill="#4d675f">虚线：待项目验证的机制；实线：披露的计量联系；点线：集团历史结果。</text><text x="20" y="664" font-size="18" fill="#4d675f">2024→2025：主营毛利+3.05亿；CFO+1.52亿；简化现金余量+2.30亿。</text><text x="20" y="688" font-size="18" fill="#4d675f">案例不能单独归属集团利润。FCFF另从核心NOPAT、折旧、经营资本和资本开支推导。</text><rect x="12" y="617" width="1216" height="101" rx="12" fill="none" stroke="#699a87" stroke-dasharray="2 5" stroke-width="1.6"/></g></svg>