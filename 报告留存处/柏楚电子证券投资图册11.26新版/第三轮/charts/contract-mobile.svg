<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1206" role="img" aria-labelledby="title desc"><title id="title">采购、交付、收入与到账的时点</title><desc id="desc">直销说明柏楚的合同关系，OEM与终端直购收入未完整拆分。；来源：2025年报p14、28、119、161–162、213。箭头表示业务联系，不预设统一账期。</desc><rect width="280" height="1206" rx="25" fill="#f0f8f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#377d69" stroke-width="1.4"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#203f37"><text x="20" y="35" font-size="24" font-weight="700">采购、交付、收入与到</text><text x="20" y="66" font-size="24" font-weight="700">账的时点</text><rect x="20" y="125" width="240" height="180" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="35" y="155" font-size="18" font-weight="700">下单：合同买方</text><text x="35" y="185" font-size="18">整机厂采购控制、软件和</text><text x="35" y="210" font-size="18">硬件</text><text x="35" y="245" font-size="18">加工厂用整机交付工件</text><path d="M 140.0 311 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="353" width="240" height="180" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="35" y="383" font-size="18" font-weight="700">安装和验收：分合同层</text><text x="35" y="413" font-size="18">柏楚供货、组测与现场支</text><text x="35" y="438" font-size="18">持</text><text x="35" y="473" font-size="18">整机厂配置试切；责任查</text><text x="35" y="498" font-size="18">合同</text><path d="M 140.0 539 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="581" width="240" height="180" rx="19" fill="#eae3f3" stroke="#c4dcd1"/><text x="35" y="611" font-size="18" font-weight="700">确认收入：按履约</text><text x="35" y="641" font-size="18">标准品签收并达到合同标</text><text x="35" y="666" font-size="18">准</text><text x="35" y="701" font-size="18">其他软件交付；有效期软</text><text x="35" y="726" font-size="18">件激活</text><path d="M 140.0 767 v 35" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="809" width="240" height="180" rx="19" fill="#f5ead9" stroke="#c4dcd1"/><text x="35" y="839" font-size="18" font-weight="700">到账：按结算回款</text><text x="35" y="869" font-size="18">年度折扣预估冲收入、实</text><text x="35" y="894" font-size="18">结调整</text><text x="35" y="929" font-size="18">货款到账独立；售后和质</text><text x="35" y="954" font-size="18">保查条款</text><text x="20" y="1042" font-size="16" fill="#4d675f">直销说明柏楚的合同关系，OE</text><text x="20" y="1066" font-size="16" fill="#4d675f">M与终端直购收入未完整拆分。</text><text x="20" y="1090" font-size="16" fill="#4d675f">来源：2025年报p14、2</text><text x="20" y="1114" font-size="16" fill="#4d675f">8、119、161–162、</text><text x="20" y="1138" font-size="16" fill="#4d675f">213。箭头表示业务联系，不</text><text x="20" y="1162" font-size="16" fill="#4d675f">预设统一账期。</text></g></svg>