<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 481" role="img" aria-labelledby="title desc"><title id="title">从一张板材图到合格工件</title><desc id="desc">标准软件简单安装；整机配置、试切、培训与维护分项承担。；来源：2025年报p5–6、14、18、161–162。工艺结果还受材料、光源和机械条件影响。</desc><rect width="1240" height="481" rx="25" fill="#f0f8f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#377d69" stroke-width="1.4"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#203f37"><text x="20" y="35" font-size="30" font-weight="700">从一张板材图到合格工件</text><rect x="20.0" y="125" width="277.5" height="185" rx="19" fill="#dcefe7" stroke="#c4dcd1"/><text x="35.0" y="155" font-size="18" font-weight="700">图纸与排样</text><text x="35.0" y="185" font-size="20">CAD读图、编辑几何</text><text x="35.0" y="245" font-size="20">套料安排板面和材料使用</text><path d="M 302.5 217.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="327.5" y="125" width="277.5" height="185" rx="19" fill="#e3edf9" stroke="#c4dcd1"/><text x="342.5" y="155" font-size="18" font-weight="700">刀路与工艺</text><text x="342.5" y="185" font-size="20">CAM安排穿孔、共边、顺序</text><text x="342.5" y="245" font-size="20">管材还需处理焊缝与偏差</text><path d="M 610.0 217.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="635.0" y="125" width="277.5" height="185" rx="19" fill="#eae3f3" stroke="#c4dcd1"/><text x="650.0" y="155" font-size="18" font-weight="700">轨迹与速度</text><text x="650.0" y="185" font-size="20">NC协调机床与驱动运动</text><text x="650.0" y="245" font-size="20">激光器供光、切割头聚焦</text><path d="M 917.5 217.5 h 21" fill="none" stroke="#377d69" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="942.5" y="125" width="277.5" height="185" rx="19" fill="#f5ead9" stroke="#c4dcd1"/><text x="957.5" y="155" font-size="18" font-weight="700">反馈与工件</text><text x="957.5" y="185" font-size="20">电容等传感反馈调节间距</text><text x="957.5" y="245" font-size="20">尺寸、边缘和节拍由整机验</text><text x="957.5" y="270" font-size="20">证</text><text x="20" y="385" font-size="18" fill="#4d675f">标准软件简单安装；整机配置、试切、培训与维护分项承担。</text><text x="20" y="409" font-size="18" fill="#4d675f">来源：2025年报p5–6、14、18、161–162。工艺结果还受材料、光源和机械条件影响。</text></g></svg>